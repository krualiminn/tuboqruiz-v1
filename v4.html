<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TOBO Quiz - สื่อการสอนยุคใหม่</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600;800;900&display=swap');
        body { font-family: 'Kanit', sans-serif; overflow-x: hidden; background-color: #f8fafc; }
        
        .animate-fade-in-up { animation: fadeInUp 0.5s ease-out forwards; }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        
        .animate-float { animation: float 6s ease-in-out infinite; }
        .animate-float-delayed { animation: float 6s ease-in-out infinite; animation-delay: 3s; }
        @keyframes float { 
            0% { transform: translateY(0px) rotate(0deg); } 
            50% { transform: translateY(-20px) rotate(10deg); } 
            100% { transform: translateY(0px) rotate(0deg); } 
        }

        /* ปุ่มสไตล์ EdTech 3D */
        .btn-3d { box-shadow: 0 8px 0 rgba(0,0,0,0.2); transition: all 0.1s cubic-bezier(0.4, 0, 0.2, 1); }
        .btn-3d:active { box-shadow: 0 0px 0 rgba(0,0,0,0.2); transform: translateY(8px); }
        .btn-3d-emerald { background-color: #10b981; box-shadow: 0 8px 0 #047857; color: white; }
        .btn-3d-emerald:active { box-shadow: 0 0px 0 #047857; transform: translateY(8px); }
        .btn-3d-blue { background-color: #3b82f6; box-shadow: 0 8px 0 #1d4ed8; color: white; }
        .btn-3d-blue:active { box-shadow: 0 0px 0 #1d4ed8; transform: translateY(8px); }
        .btn-3d-slate { background-color: #334155; box-shadow: 0 8px 0 #0f172a; color: white; }
        .btn-3d-slate:active { box-shadow: 0 0px 0 #0f172a; transform: translateY(8px); }
    </style>
</head>
<body class="text-slate-800 antialiased selection:bg-indigo-300">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // ==========================================
        // ระบบเสียง
        // ==========================================
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const playTone = (freq, type, duration) => {
            if(audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = type; osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.start(); gain.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + duration);
            osc.stop(audioCtx.currentTime + duration);
        };

        const Sounds = {
            tick: () => playTone(800, 'square', 0.05),
            start: () => { playTone(440, 'sine', 0.1); setTimeout(()=>playTone(554, 'sine', 0.2), 100); setTimeout(()=>playTone(659, 'sine', 0.3), 200); },
            correct: () => { playTone(523.25, 'sine', 0.1); setTimeout(()=>playTone(659.25, 'sine', 0.2), 100); setTimeout(()=>playTone(783.99, 'sine', 0.4), 200); },
            wrong: () => { playTone(300, 'sawtooth', 0.3); setTimeout(()=>playTone(250, 'sawtooth', 0.4), 200); },
            fanfare: () => { playTone(523, 'square', 0.2); setTimeout(()=>playTone(523, 'square', 0.2), 200); setTimeout(()=>playTone(783, 'square', 0.6), 400); }
        };

        // ==========================================
        // ไอคอนรูปทรงต่างๆ สำหรับปุ่มตัวเลือก
        // ==========================================
        const ShapeIcon = ({ index, className = "w-16 h-16 text-white" }) => {
            const shapes = [
                <polygon points="12 2 22 20 2 20" fill="currentColor"/>, 
                <polygon points="12 2 22 12 12 22 2 12" fill="currentColor"/>, 
                <circle cx="12" cy="12" r="10" fill="currentColor"/>, 
                <rect x="3" y="3" width="18" height="18" rx="2" fill="currentColor"/> 
            ];
            return <svg viewBox="0 0 24 24" className={className}>{shapes[index]}</svg>;
        };

        const COLORS = ['bg-rose-500', 'bg-blue-500', 'bg-amber-500', 'bg-emerald-500'];

        function App() {
            const [view, setView] = useState('home'); 
            const [gameData, setGameData] = useState(null);
            const [errorMsg, setErrorMsg] = useState('');

            const showError = (msg) => { setErrorMsg(msg); setTimeout(() => setErrorMsg(''), 6000); };
            const goHome = () => { setView('home'); setGameData(null); };

            return (
                <div className="min-h-screen flex flex-col font-['Kanit']">
                    {/* Error Notification Overlay */}
                    {errorMsg && (
                        <div className="fixed top-4 right-4 bg-red-600 text-white px-6 py-4 rounded-2xl shadow-2xl z-50 animate-fade-in-up border-2 border-red-400 flex items-center font-bold text-lg max-w-lg">
                            <i className="fa-solid fa-circle-exclamation mr-3 text-2xl"></i> 
                            <div>{errorMsg}</div>
                        </div>
                    )}
                    
                    {/* Routing based on current view */}
                    {view === 'home' && <HomeView onStart={(data) => { setGameData(data); setView('playing'); }} showError={showError} />}
                    {view === 'playing' && gameData && <GameView gameData={gameData} onEnd={(finalScore) => { setGameData({...gameData, finalScore}); setView('summary'); }} goHome={goHome} />}
                    {view === 'summary' && gameData && <SummaryView gameData={gameData} goHome={goHome} />}
                </div>
            );
        }

        function HomeView({ onStart, showError }) {
            const [topic, setTopic] = useState('');
            const [grade, setGrade] = useState('ป.4');
            const [count, setCount] = useState(5);
            const [timeLimit, setTimeLimit] = useState(15);
            const [apiKey, setApiKey] = useState(''); // เก็บ API Key
            const [loading, setLoading] = useState(false);
            const [showSettings, setShowSettings] = useState(false); // ควบคุมหน้าต่างตั้งค่า (แอบๆ)

            // โหลด API Key ที่เคยบันทึกไว้ในเครื่อง
            useEffect(() => {
                const savedKey = localStorage.getItem('gemini_api_key');
                if (savedKey) setApiKey(savedKey);
            }, []);

            const generateQuestionsWithGemini = async () => {
                const prompt = `สร้างชุดคำถามปรนัย (Multiple Choice) ภาษาไทย
หัวข้อ: ${topic}
ระดับชั้น: ${grade}
จำนวน: ${count} ข้อ

ส่งกลับเฉพาะ JSON Array เท่านั้น ห้ามมีคำอธิบายอื่น ห้ามมี markdown (เช่น \`\`\`json)
รูปแบบ JSON ที่ต้องการ:
[
  {
    "question": "คำถาม?",
    "options": ["ตัวเลือก 1", "ตัวเลือก 2", "ตัวเลือก 3", "ตัวเลือก 4"],
    "correctIndex": 0, // ระบุ index ของคำตอบที่ถูกต้อง (0-3)
    "explanation": "คำอธิบายสั้นๆ ว่าทำไมข้อนี้ถึงถูก"
  }
]`;
                
                // ใช้โมเดล gemini-3.6-flash ตามคำขอใหม่
                const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3.6-flash:generateContent?key=${apiKey.trim()}`;
                
                const response = await fetch(apiUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: prompt }] }],
                        generationConfig: { responseMimeType: "application/json" }
                    })
                });

                if (!response.ok) {
                    const errData = await response.json();
                    throw new Error(`API Error: ${response.status} - ${errData.error?.message || 'ไม่สามารถติดต่อ Google Gemini ได้'}`);
                }

                const result = await response.json();
                let jsonString = result.candidates[0]?.content?.parts[0]?.text;
                
                if (!jsonString) throw new Error("AI ไม่ได้ส่งข้อมูลกลับมา กรุณาลองใหม่");

                // ทำความสะอาดข้อความกรณีที่ AI ยังคงส่ง markdown กลับมา
                jsonString = jsonString.replace(/```json/g, '').replace(/```/g, '').trim();
                
                try {
                    const parsedData = JSON.parse(jsonString);
                    if (!Array.isArray(parsedData) || parsedData.length === 0) throw new Error("รูปแบบข้อมูลผิดพลาด");
                    return parsedData;
                } catch (parseError) {
                    throw new Error("AI ส่งข้อมูลรูปแบบผิดพลาด กรุณาลองใหม่อีกครั้ง");
                }
            };

            const handleCreate = async (e) => {
                e.preventDefault();
                if(!topic) return showError("กรุณาระบุหัวข้อครับ");
                
                if(!apiKey) {
                    setShowSettings(true);
                    return showError("กรุณาใส่ Gemini API Key ในการตั้งค่าก่อนเริ่มสร้างครับ");
                }
                
                setLoading(true);
                try {
                    // บันทึก API key ลงในเครื่อง
                    localStorage.setItem('gemini_api_key', apiKey.trim());
                    
                    // สร้างคำถามด้วย AI
                    const questions = await generateQuestionsWithGemini();
                    
                    // เริ่มเกมทันที ส่งต่อ Data ไปยัง GameView
                    onStart({
                        questions,
                        timeLimit: Number(timeLimit),
                        topic,
                        gradeLevel: grade
                    });
                    
                    Sounds.start();
                } catch(err) { 
                    console.error(err);
                    showError(err.message); 
                }
                setLoading(false);
            };

            return (
                <div className="flex-1 flex flex-col md:flex-row bg-slate-50 relative">
                    
                    {/* ปุ่มตั้งค่ามุมซ้ายบน (ซ่อน API Key ไว้ตรงนี้ แบบแอบๆ) */}
                    <button onClick={() => setShowSettings(true)} className="absolute top-6 left-6 z-30 bg-white/10 hover:bg-white/30 text-white rounded-full w-12 h-12 flex items-center justify-center backdrop-blur-md transition-all shadow-lg border border-white/20 hover:rotate-90">
                        <i className="fa-solid fa-gear text-xl"></i>
                    </button>

                    {/* Modal ตั้งค่า API Key */}
                    {showSettings && (
                        <div className="fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4 backdrop-blur-sm animate-fade-in-up">
                            <div className="bg-white rounded-[2rem] p-8 max-w-md w-full shadow-2xl relative border-2 border-slate-100">
                                <button onClick={() => setShowSettings(false)} className="absolute top-4 right-4 text-slate-400 hover:text-rose-500 transition-colors w-10 h-10 flex items-center justify-center rounded-full bg-slate-100 hover:bg-rose-100">
                                    <i className="fa-solid fa-xmark text-2xl"></i>
                                </button>
                                <div className="text-center mb-6 mt-2">
                                    <div className="w-16 h-16 bg-slate-100 text-slate-600 rounded-full flex items-center justify-center mx-auto mb-4 shadow-inner"><i className="fa-solid fa-key text-3xl"></i></div>
                                    <h3 className="text-2xl font-black text-slate-800">การเชื่อมต่อ AI (ลับเฉพาะ)</h3>
                                    <p className="text-slate-500 mt-2 text-sm">ใส่ Gemini API Key ของคุณที่นี่ (aistudio.google.com)<br/>ข้อมูลจะถูกบันทึกไว้ในเบราว์เซอร์นี้เท่านั้น</p>
                                </div>
                                <div>
                                    <input type="password" placeholder="AIzaSy..." value={apiKey} onChange={(e)=>setApiKey(e.target.value)} className="w-full text-center text-lg p-4 bg-slate-50 border-2 border-slate-200 rounded-xl focus:border-indigo-500 focus:outline-none mb-4 tracking-widest" />
                                    <button onClick={() => { localStorage.setItem('gemini_api_key', apiKey.trim()); setShowSettings(false); showError("บันทึก API Key ลงเครื่องเรียบร้อย"); }} className="w-full btn-3d-slate rounded-xl p-4 text-xl font-black">บันทึกข้อมูล</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* ด้านซ้าย - อธิบายระบบ */}
                    <div className="w-full md:w-[60%] bg-gradient-to-br from-indigo-600 via-purple-700 to-fuchsia-800 text-white p-8 md:p-16 flex flex-col justify-center relative overflow-hidden">
                        <div className="absolute top-10 left-10 text-yellow-300 opacity-30 animate-float"><ShapeIcon index={0} className="w-20 h-20" /></div>
                        <div className="absolute bottom-20 left-1/4 text-emerald-300 opacity-30 animate-float-delayed"><ShapeIcon index={2} className="w-24 h-24" /></div>
                        <div className="absolute top-1/4 right-10 text-rose-300 opacity-30 animate-float" style={{animationDelay: '1s'}}><ShapeIcon index={1} className="w-16 h-16" /></div>

                        <div className="relative z-10 w-full max-w-2xl mx-auto">
                            <div className="inline-block bg-white/20 px-6 py-2 rounded-full font-bold tracking-widest text-sm mb-6 backdrop-blur-sm border border-white/30 uppercase">
                                สื่อการสอนยุคใหม่แบบไม่ต้องติดตั้ง
                            </div>
                            <h1 className="text-6xl md:text-[6rem] font-black mb-6 tracking-tighter leading-none text-transparent bg-clip-text bg-gradient-to-br from-yellow-200 to-yellow-500 drop-shadow-sm">
                                TOBO <span className="text-white">Quiz</span>
                            </h1>
                            <p className="text-xl md:text-2xl text-purple-100 font-medium mb-10 leading-relaxed">
                                โหมดกระดานหน้าชั้นเรียน (Smartboard) <br className="hidden md:block"/> 
                                พิมพ์หัวข้อ ปล่อย AI แต่งโจทย์ และเล่นบนจอใหญ่ได้ทันที!
                            </p>
                            
                            <div className="bg-black/30 rounded-2xl p-5 backdrop-blur-sm border border-white/10 flex items-center">
                                <div className="bg-gradient-to-br from-indigo-400 to-purple-500 p-4 rounded-xl mr-5 shadow-lg">
                                    <i className="fa-solid fa-code text-white text-2xl"></i>
                                </div>
                                <div>
                                    <div className="text-sm text-yellow-300 font-bold uppercase tracking-widest mb-1">พัฒนาโดย</div>
                                    <div className="text-base font-bold text-white mb-1">ครูมิน อลีมิน เจ๊ะอีซอ <span className="text-purple-200 font-normal text-sm block md:inline">โรงเรียนบ้านเจ๊ะยอ</span></div>
                                    <div className="text-base font-bold text-white">ครูยี แวอัสรี แวมายิ <span className="text-purple-200 font-normal text-sm block md:inline">โรงเรียนบ้านปูโป๊ะ</span></div>
                                </div>
                            </div>
                        </div>
                    </div>

                    {/* ด้านขวา - ฟอร์มสร้างเกม */}
                    <div className="w-full md:w-[40%] flex items-center justify-center p-6 md:p-12 relative bg-white border-l border-slate-200 shadow-[-10px_0_30px_rgba(0,0,0,0.03)]">
                        <div className="w-full max-w-md">
                            {loading ? (
                                <div className="flex flex-col items-center justify-center py-20 text-indigo-600 animate-pulse">
                                    <i className="fa-solid fa-microchip text-7xl mb-6"></i>
                                    <h2 className="text-3xl font-black text-center">AI กำลังแต่งคำถาม...<br/><span className="text-xl text-slate-500 font-medium mt-2 block">อาจใช้เวลาประมาณ 10-15 วินาที</span></h2>
                                </div>
                            ) : (
                                <form onSubmit={handleCreate} className="space-y-4 animate-fade-in-up bg-white p-6 md:p-8 rounded-[2.5rem] shadow-[0_10px_40px_rgba(0,0,0,0.08)] border-2 border-slate-100">
                                    <div className="text-center mb-6">
                                        <div className="w-16 h-16 bg-blue-100 text-blue-600 rounded-full flex items-center justify-center mx-auto mb-4 shadow-sm">
                                            <i className="fa-solid fa-wand-magic-sparkles text-3xl"></i>
                                        </div>
                                        <h2 className="text-2xl md:text-3xl font-black text-slate-800">สร้างคำถามด้วย AI</h2>
                                    </div>
                                    <div>
                                        <label className="block text-slate-500 font-bold mb-1 text-sm">หัวข้อเรื่อง / รายวิชา</label>
                                        <input type="text" placeholder="เช่น สัตว์น่ารู้, ประวัติศาสตร์" value={topic} onChange={(e)=>setTopic(e.target.value)} className="w-full text-lg md:text-xl font-bold p-3 md:p-4 bg-slate-50 border-2 border-slate-200 rounded-xl focus:border-blue-500 focus:bg-white focus:outline-none transition-all" required />
                                    </div>
                                    <div className="grid grid-cols-2 gap-3">
                                        <div>
                                            <label className="block text-slate-500 font-bold mb-1 text-sm">ระดับชั้น</label>
                                            <select value={grade} onChange={(e)=>setGrade(e.target.value)} className="w-full text-lg font-bold p-3 bg-slate-50 border-2 border-slate-200 rounded-xl focus:border-blue-500 focus:outline-none cursor-pointer">
                                                {['ป.1','ป.2','ป.3','ป.4','ป.5','ป.6','ม.1','ม.2','ม.3','ม.4','ม.5','ม.6'].map(g => <option key={g} value={g}>{g}</option>)}
                                            </select>
                                        </div>
                                        <div>
                                            <label className="block text-slate-500 font-bold mb-1 text-sm">จำนวนข้อ</label>
                                            <input type="number" value={count} onChange={(e)=>setCount(e.target.value)} min="1" max="20" className="w-full text-lg font-bold p-3 bg-slate-50 border-2 border-slate-200 rounded-xl focus:border-blue-500 focus:outline-none" required />
                                        </div>
                                    </div>
                                    <div>
                                        <label className="block text-slate-500 font-bold mb-1 text-sm">เวลาต่อข้อ (วินาที)</label>
                                        <select value={timeLimit} onChange={(e)=>setTimeLimit(e.target.value)} className="w-full text-lg font-bold p-3 bg-slate-50 border-2 border-slate-200 rounded-xl focus:border-blue-500 focus:outline-none cursor-pointer">
                                            <option value="10">10 วินาที</option>
                                            <option value="15">15 วินาที</option>
                                            <option value="20">20 วินาที</option>
                                            <option value="30">30 วินาที</option>
                                        </select>
                                    </div>
                                    <button type="submit" className="w-full btn-3d-blue rounded-xl p-4 text-xl font-black mt-4 flex items-center justify-center">
                                        เริ่มเล่นทันที <i className="fa-solid fa-play ml-2"></i>
                                    </button>
                                </form>
                            )}
                        </div>
                    </div>
                </div>
            );
        }

        function GameView({ gameData, onEnd, goHome }) {
            const [currentIdx, setCurrentIdx] = useState(0);
            const [status, setStatus] = useState('question'); // 'question' | 'reveal'
            const [timeLeft, setTimeLeft] = useState(gameData.timeLimit);
            const [score, setScore] = useState(0);
            const [selectedIdx, setSelectedIdx] = useState(null);
            const [showExplanation, setShowExplanation] = useState(false);

            const currentQ = gameData.questions[currentIdx];
            const isLast = currentIdx >= gameData.questions.length - 1;

            // Timer Effect
            useEffect(() => {
                if (status === 'question') {
                    const timer = setInterval(() => {
                        setTimeLeft(prev => {
                            if (prev <= 1) {
                                clearInterval(timer);
                                handleTimeOut();
                                return 0;
                            }
                            if (prev <= 6) Sounds.tick();
                            return prev - 1;
                        });
                    }, 1000);
                    return () => clearInterval(timer);
                }
            }, [status, currentIdx]);

            const handleAnswer = (idx) => {
                if (status !== 'question') return; // Prevent clicking during reveal
                setSelectedIdx(idx);
                
                const isCorrect = idx === currentQ.correctIndex;
                if (isCorrect) {
                    Sounds.correct();
                    // ให้คะแนนตามเวลาที่เหลือ (ยิ่งตอบเร็วยิ่งได้เยอะ) ฐานคะแนน 1000
                    const timeRatio = Math.max(0, timeLeft / gameData.timeLimit);
                    const earned = Math.round(500 + (500 * timeRatio));
                    setScore(prev => prev + earned);
                } else {
                    Sounds.wrong();
                }
                
                setStatus('reveal');
            };

            const handleTimeOut = () => {
                setSelectedIdx(null);
                Sounds.wrong();
                setStatus('reveal');
            };

            const handleNext = () => {
                setShowExplanation(false);
                if (isLast) {
                    Sounds.fanfare();
                    onEnd(score);
                } else {
                    setCurrentIdx(prev => prev + 1);
                    setStatus('question');
                    setTimeLeft(gameData.timeLimit);
                    setSelectedIdx(null);
                }
            };

            return (
                <div className="flex-1 flex flex-col bg-slate-100 p-4 md:p-8 relative min-h-screen">
                    
                    {/* ปุ่มออกกลางคัน */}
                    <button onClick={goHome} className="absolute top-4 left-4 z-40 bg-white/50 hover:bg-white text-slate-500 px-4 py-2 rounded-full font-bold transition-colors shadow-sm">
                        <i className="fa-solid fa-arrow-left mr-2"></i> ออกจากเกม
                    </button>

                    {/* Modal คำอธิบาย */}
                    {showExplanation && (
                        <div className="absolute inset-0 bg-black/80 z-50 flex flex-col items-center justify-center p-4 md:p-8 backdrop-blur-sm">
                            <div className="bg-white w-full max-w-4xl rounded-[3rem] p-8 md:p-12 text-center animate-fade-in-up relative shadow-2xl border-b-8 border-indigo-500">
                                <div className="flex justify-end w-full mb-6">
                                   <button onClick={()=>setShowExplanation(false)} className="bg-rose-100 text-rose-600 hover:bg-rose-500 hover:text-white px-6 py-3 rounded-full font-bold text-xl flex items-center transition-colors shadow-sm">
                                       <i className="fa-solid fa-xmark mr-3 text-2xl"></i> ปิดคำอธิบาย
                                   </button>
                                </div>
                                <h3 className="text-3xl md:text-5xl font-black text-indigo-600 mb-8 flex items-center justify-center">
                                    <i className="fa-solid fa-lightbulb mr-4 text-yellow-400 text-5xl"></i> คำอธิบาย
                                </h3>
                                <p className="text-3xl md:text-4xl font-bold text-slate-700 leading-normal mb-8">{currentQ.explanation}</p>
                            </div>
                        </div>
                    )}

                    {/* Header: Progress, Timer, Score */}
                    <div className="flex justify-between items-center mb-6 pt-10 md:pt-4">
                        <div className="bg-white px-6 md:px-8 py-3 rounded-2xl font-black text-xl md:text-2xl shadow-sm border-2 border-slate-200 text-indigo-600 flex items-center">
                            ข้อ {currentIdx + 1} / {gameData.questions.length}
                        </div>
                        
                        {status === 'reveal' ? (
                            <div className="flex gap-2 md:gap-4 animate-fade-in-up">
                                <button onClick={()=>setShowExplanation(true)} className="btn-3d bg-amber-500 px-6 md:px-8 py-3 md:py-4 font-black text-xl md:text-2xl text-white rounded-2xl hover:bg-amber-600 flex items-center">
                                    <i className="fa-solid fa-circle-info mr-2"></i> คำอธิบาย
                                </button>
                                <button onClick={handleNext} className={`btn-3d px-6 md:px-10 py-3 md:py-4 font-black text-xl md:text-2xl rounded-2xl flex items-center ${isLast ? 'bg-pink-600 hover:bg-pink-700 text-white' : 'btn-3d-blue'}`}>
                                    {isLast ? 'สรุปผล' : 'ถัดไป'} <i className={`fa-solid ${isLast ? 'fa-trophy' : 'fa-chevron-right'} ml-2`}></i>
                                </button>
                            </div>
                        ) : (
                            <div className="flex items-center space-x-4 md:space-x-8">
                                <div className="text-xl md:text-2xl font-bold text-slate-500 bg-white px-6 md:px-8 py-3 rounded-2xl shadow-sm border-2 border-slate-200">
                                    คะแนน: <span className="text-indigo-600 font-black">{score}</span>
                                </div>
                                <div className={`w-20 h-20 md:w-24 md:h-24 rounded-full flex items-center justify-center text-4xl md:text-5xl font-black shadow-lg border-4 ${timeLeft <= 5 ? 'bg-red-500 border-red-200 animate-pulse text-white' : 'bg-indigo-600 border-indigo-200 text-white'}`}>
                                    {timeLeft}
                                </div>
                            </div>
                        )}
                    </div>

                    {/* Question Box */}
                    <div className="bg-white flex-1 rounded-[3rem] shadow-lg flex flex-col items-center justify-center p-8 md:p-12 mb-8 text-center border-b-8 border-indigo-100 relative">
                        {status === 'reveal' && selectedIdx !== null && (
                            <div className={`absolute -top-6 bg-black text-white px-6 py-2 rounded-full font-black text-2xl shadow-xl border-4 ${selectedIdx === currentQ.correctIndex ? 'bg-emerald-500 border-emerald-200' : 'bg-rose-500 border-rose-200'}`}>
                                {selectedIdx === currentQ.correctIndex ? 'เก่งมาก! ตอบถูกต้อง 🎉' : 'เสียใจด้วย ตอบผิด 😥'}
                            </div>
                        )}
                        {status === 'reveal' && selectedIdx === null && (
                            <div className="absolute -top-6 bg-slate-600 text-white px-6 py-2 rounded-full font-black text-2xl shadow-xl border-4 border-slate-400">
                                หมดเวลา! ⏱️
                            </div>
                        )}
                        <h2 className="text-4xl md:text-6xl lg:text-7xl font-black text-slate-800 leading-normal">{currentQ.question}</h2>
                    </div>

                    {/* Answer Buttons (Interactive Smartboard Style) */}
                    <div className="grid grid-cols-2 gap-4 md:gap-8 min-h-[250px] md:min-h-[350px]">
                        {currentQ.options.map((opt, idx) => {
                            const isCorrect = idx === currentQ.correctIndex;
                            const isSelected = idx === selectedIdx;
                            const isReveal = status === 'reveal';
                            
                            // Style Logic for Reveal mode
                            let buttonStyle = `${COLORS[idx]} btn-3d`;
                            let dimClass = '';
                            
                            if (isReveal) {
                                buttonStyle = COLORS[idx]; // Remove 3d pop effect when revealed
                                if (isCorrect) {
                                    dimClass = 'scale-[1.02] z-10 shadow-2xl ring-8 ring-emerald-400';
                                } else if (isSelected) {
                                    dimClass = 'opacity-80 ring-8 ring-rose-400 grayscale-0';
                                } else {
                                    dimClass = 'opacity-30 scale-95 grayscale';
                                }
                            } else {
                                dimClass = 'hover:scale-[1.02] active:scale-95 cursor-pointer';
                            }

                            return (
                                <button 
                                    key={idx} 
                                    onClick={() => handleAnswer(idx)}
                                    disabled={isReveal}
                                    className={`${buttonStyle} ${dimClass} rounded-[2.5rem] md:rounded-[3.5rem] shadow-md relative flex flex-col items-center justify-center p-6 md:p-8 transition-all duration-500 w-full h-full border-t-2 border-white/20 outline-none`}
                                >
                                    <div className="absolute top-6 left-6 opacity-80">
                                        <ShapeIcon index={idx} className="w-12 h-12 md:w-16 md:h-16 text-white" />
                                    </div>
                                    <span className="text-white font-black text-3xl md:text-5xl lg:text-6xl text-center px-4 md:px-16 z-10 drop-shadow-md">{opt}</span>
                                    
                                    {isReveal && isCorrect && (
                                        <div className="absolute top-6 right-6 text-white bg-black/30 rounded-full p-3 backdrop-blur-sm animate-bounce z-20">
                                            <i className="fa-solid fa-check text-4xl"></i>
                                        </div>
                                    )}
                                    {isReveal && !isCorrect && isSelected && (
                                        <div className="absolute top-6 right-6 text-white bg-black/30 rounded-full p-3 backdrop-blur-sm z-20">
                                            <i className="fa-solid fa-xmark text-4xl"></i>
                                        </div>
                                    )}
                                </button>
                            );
                        })}
                    </div>
                </div>
            );
        }

        function SummaryView({ gameData, goHome }) {
            return (
                <div className="flex-1 flex flex-col bg-gradient-to-b from-slate-900 via-indigo-900 to-purple-900 overflow-y-auto relative items-center justify-center p-8">
                    {/* Confetti Background */}
                    <div className="absolute inset-0 overflow-hidden pointer-events-none z-0">
                        {[...Array(15)].map((_, i) => (
                            <div key={i} className="absolute text-4xl animate-float opacity-80" style={{
                                left: `${Math.random() * 100}%`, top: `${Math.random() * 100}%`,
                                animationDelay: `${Math.random() * 5}s`, animationDuration: `${5 + Math.random() * 5}s`
                            }}>
                                {['🎉', '🎊', '✨', '⭐', '🏆'][Math.floor(Math.random() * 5)]}
                            </div>
                        ))}
                    </div>

                    <div className="z-10 w-full max-w-2xl text-center animate-fade-in-up">
                        <h2 className="text-5xl md:text-7xl font-black text-transparent bg-clip-text bg-gradient-to-b from-yellow-300 to-yellow-600 drop-shadow-[0_5px_5px_rgba(0,0,0,1)] tracking-tighter mb-12">
                            จบเกมเรียบร้อย!
                        </h2>

                        <div className="bg-white/10 backdrop-blur-md rounded-[3rem] p-12 border-2 border-white/20 shadow-2xl relative overflow-hidden mb-12">
                            <div className="absolute top-0 left-0 w-full h-4 bg-gradient-to-r from-emerald-400 to-blue-500"></div>
                            
                            <p className="text-slate-300 font-bold mb-4 uppercase tracking-widest text-2xl">คะแนนรวมที่ได้</p>
                            <p className="text-[6rem] md:text-[8rem] font-black text-white leading-none drop-shadow-xl mb-6">
                                {gameData.finalScore}
                            </p>
                            <p className="text-indigo-200 font-bold text-xl bg-black/20 inline-block px-8 py-3 rounded-full border border-white/10">
                                จากการตอบทั้งหมด {gameData.questions.length} ข้อ
                            </p>
                        </div>

                        <button onClick={goHome} className="btn-3d bg-white text-indigo-900 px-12 py-5 rounded-full font-black text-3xl flex items-center justify-center mx-auto hover:bg-slate-200 shadow-xl">
                            <i className="fa-solid fa-rotate-right mr-4"></i> สร้างคำถามใหม่
                        </button>
                    </div>
                </div>
            );
        }

        // Render App
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
